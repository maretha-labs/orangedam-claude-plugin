name: Plugin CI & Hygiene

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test & skills-ref validators
        run: |
          python -m pip install --upgrade pip
          pip install pytest "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Run plugin directory hygiene & clean-room check
        run: python3 scripts/check_plugin_hygiene.py --plugin-dir plugin --repo-root .

      - name: Validate every skill against Agent Skills specification
        run: |
          for skill in plugin/skills/*/; do
            echo "Validating $skill"
            skills-ref validate "$skill"
          done

      - name: Run Python validator unit tests
        run: PYTHONDONTWRITEBYTECODE=1 pytest -v tests/
